name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # No gradlew in the repo yet, so use a Gradle install. If you add the wrapper
      # (run `gradle wrapper` once locally and commit it), change this to `gradle-version: wrapper`.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: donut-auction
          path: build/libs/*.jar

      # Pushing a tag like v1.0.0 publishes the jar as a GitHub release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
